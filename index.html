<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ready Tunes</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0d0d0d;
    color: white;
}

header {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(to bottom, #000, #1a1a1a);
}

header h1 {
    font-size: 60px;
    margin: 0;
}

header p {
    color: #aaa;
}

button {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
}

section {
    padding: 40px 20px;
}

.music-box {
    background: #1c1c1c;
    padding: 20px;
    border-radius: 10px;
}

.track {
    margin-bottom: 20px;
}

footer {
    text-align: center;
    padding: 20px;
    background: #000;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>READY TUNES</h1>
    <p>Official Artist Website</p>
</header>

<section>
    <h2>Music</h2>

    <div class="music-box">
        <div class="track">
            <h3>Song 1</h3>
            <audio controls>
                <source src="music.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>
</section>

<section>
    <h2>About</h2>
    <p>This is the official Ready Tunes website.</p>
</section>

<footer>
    © 2026 Ready Tunes
</footer>

</body>
</html>
